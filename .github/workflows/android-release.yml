# Tag-driven signed release build (Gradle): builds a signed APK + AAB and
# opens a draft GitHub release. Set the release secrets once in repo
# settings:
#   KYRON_KEYSTORE_B64       base64 of the upload keystore
#   KYRON_KEYSTORE_PASSWORD  keystore password
#   KYRON_KEY_ALIAS          upload key alias
#   KYRON_KEY_PASSWORD       key password
name: Android release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Decode upload keystore
        env: { KEYSTORE_B64: "${{ secrets.KYRON_KEYSTORE_B64 }}" }
        run: |
          # Accept either raw base64 or a PEM-wrapped value: strip any
          # PEM headers/footers and whitespace, then decode.
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | sed 's/-----BEGIN[^-]*-----//g; s/-----END[^-]*-----//g' | base64 -d > "$RUNNER_TEMP/upload.jks"
          # Sanity check: a JKS/PKCS12 keystore starts with the magic bytes
          # 0xFE 0xED (JKS) or 0x30 0x82 (PKCS12 DER). Anything starting
          # with '-' (0x2D) means PEM headers survived.
          first=$(od -An -tx1 -N1 "$RUNNER_TEMP/upload.jks" | tr -d ' ')
          echo "keystore first byte: 0x$first"
          [ "$first" != "2d" ] || { echo "::error::Decoded keystore still starts with '-' (PEM header). Re-create the KYRON_KEYSTORE_B64 secret as raw base64."; exit 1; }
      - name: Build signed APK + AAB
        env:
          KYRON_KEYSTORE: ${{ runner.temp }}/upload.jks
          KYRON_KEYSTORE_PASSWORD: ${{ secrets.KYRON_KEYSTORE_PASSWORD }}
          KYRON_KEY_ALIAS: ${{ secrets.KYRON_KEY_ALIAS }}
          KYRON_KEY_PASSWORD: ${{ secrets.KYRON_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Draft GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --draft --generate-notes \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab
