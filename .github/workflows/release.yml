# Release workflow for Kyron APK
#
# This workflow builds and publishes the APK as a GitHub release artifact.
# It is triggered manually or when a tag matching v*.*.* is pushed.
#
# NOTE: This workflow requires the build environment to be set up in CI
# (Android SDK, Kotlin compiler, build directory structure) before it can
# run end-to-end. Currently, this is a template for the release process.
#
# To enable: Update the "Build APK" job with the actual build steps from
# app/build_manual.sh once the environment is set up.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.0.1)'
        required: true
        default: 'v2.0.0'

jobs:
  # Build the APK
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    # This job is currently a placeholder. To enable:
    # 1. Set up Android SDK
    # 2. Download Kotlin compiler
    # 3. Create build directory structure
    # 4. Run fetch_deps.sh
    # 5. Run build_manual.sh
    if: false  # Disabled until environment is set up
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # Install Android SDK command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mkdir -p $HOME/kyron-build/android-sdk/cmdline-tools/latest
          mv cmdline-tools/* $HOME/kyron-build/android-sdk/cmdline-tools/latest/
          export ANDROID_SDK_ROOT=$HOME/kyron-build/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Kotlin compiler
        run: |
          mkdir -p $HOME/kyron-build
          cd $HOME/kyron-build
          curl -L -o kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.20/kotlin-compiler-2.0.20.zip
          unzip -q kotlin-compiler.zip

      - name: Create build structure
        run: |
          mkdir -p $HOME/kyron-build/manual/{work,deps}
          mkdir -p $HOME/kyron-build/tmp

      - name: Fetch dependencies
        run: |
          cd app
          chmod +x fetch_deps.sh
          export KB=$HOME/kyron-build
          ./fetch_deps.sh

      - name: Run manual build
        run: |
          cd app
          chmod +x build_manual.sh
          export KB=$HOME/kyron-build
          ./build_manual.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyron-apk
          path: app/Kyron-2.0.apk
          retention-days: 30

  # Create GitHub release (placeholder - requires build job to complete)
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-apk
    if: false  # Disabled until build job is enabled
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kyron-apk
          path: ./apk

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version without v: ${VERSION#v}"

      - name: Extract release notes
        id: release_notes
        run: |
          # Extract release notes from CHANGELOG.md for this version
          VERSION="${{ steps.get_version.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          # This is a simple extraction - can be enhanced with proper parsing
          if [ -f "CHANGELOG.md" ]; then
            awk "/## \[$VERSION_NO_V\]/,/^## / {print}" CHANGELOG.md > release_notes.txt
            # Remove the last line (next version header)
            head -n -1 release_notes.txt > release_notes_final.txt
            mv release_notes_final.txt release_notes.txt
          else
            echo "Release notes for $VERSION" > release_notes.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Kyron ${{ steps.get_version.outputs.version }}
          body_path: release_notes.txt
          files: ./apk/Kyron-2.0.apk
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Manual release preparation guide (always runs)
  release-guide:
    name: Release Preparation Guide
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display release instructions
        run: |
          echo "================================================"
          echo "Kyron Release Preparation Guide"
          echo "================================================"
          echo ""
          echo "The automated release workflow is currently disabled"
          echo "because the build environment needs to be set up in CI."
          echo ""
          echo "To create a release manually:"
          echo ""
          echo "1. Build the APK locally:"
          echo "   cd app"
          echo "   ./build_manual.sh"
          echo ""
          echo "2. Verify the APK:"
          echo "   - Check the file size (should be ~6-7 MB)"
          echo "   - Install on a test device"
          echo "   - Run through core flows"
          echo ""
          echo "3. Create a git tag:"
          echo "   git tag -a v2.0.1 -m 'Release v2.0.1'"
          echo "   git push origin v2.0.1"
          echo ""
          echo "4. Create a GitHub release:"
          echo "   - Go to GitHub > Releases > Draft a new release"
          echo "   - Select the tag you just pushed"
          echo "   - Upload the APK (app/Kyron-2.0.apk)"
          echo "   - Add release notes from CHANGELOG.md"
          echo "   - Publish the release"
          echo ""
          echo "5. Update documentation:"
          echo "   - Verify INSTALL.md has the latest instructions"
          echo "   - Update README.md if needed"
          echo ""
          echo "For detailed installation instructions, see INSTALL.md"
          echo "================================================"
