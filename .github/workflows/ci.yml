# CI workflow for Kyron
#
# NOTE: This workflow is a template for future CI automation. The current
# manual build pipeline (app/build_manual.sh) requires a specific directory
# structure and downloaded tools that would need to be set up in CI before
# this workflow can run end-to-end.
#
# Current status: This workflow provides validation gates that can run
# independently of the full build. Full build automation would require:
# 1. Android SDK installation in CI
# 2. Kotlin compiler setup
# 3. Dependency fetching script execution
# 4. Build directory structure creation
#
# To enable full CI: Update the "Manual Build" job with the actual
# build steps from app/build_manual.sh once the environment is set up.

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Data validation gates - can run independently of full build
  data-validation:
    name: Data Validation Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate vector pathData
        run: |
          python3 tools/validate_pathdata.py app/src/main/res || exit 1
        continue-on-error: false

      - name: Validate national coverage registry (50 states + D.C.)
        run: |
          python3 tools/coverage/coverage_pipeline.py gate || exit 1
        continue-on-error: false

      - name: Check seed dataset exists
        run: |
        # The bundled seed is a generated dataset that is deliberately NOT
        # committed to this repo (see .gitignore: it is regenerated by the
        # harvest pipeline and shipped inside the release APK / region
        # packs). Its absence on a fresh checkout is by design, so report
        # it and let the validation steps below skip — do not fail the
        # gates for a file the repo intentionally does not carry. When a
        # seed IS present, the validate + canary steps run in full.
          if [ ! -f "app/src/main/assets/places_seed_geocoded.json" ] && [ ! -f "app/src/main/assets/places_seed.json" ]; then
            echo "NOTICE: No seed dataset in assets/ — gitignored by design (generated; shipped in the APK). Seed validation steps will skip."
          else
                      echo "Seed dataset present — validation steps below will run in full."
          fi
        continue-on-error: false

      - name: Validate seed dataset (if present)
        run: |
          SEED_FILE=""
          if [ -f "app/src/main/assets/places_seed_geocoded.json" ]; then
            SEED_FILE="app/src/main/assets/places_seed_geocoded.json"
          elif [ -f "app/src/main/assets/places_seed.json" ]; then
            SEED_FILE="app/src/main/assets/places_seed.json"
          fi
          if [ -n "$SEED_FILE" ]; then
            python3 tools/validate_seed.py "$SEED_FILE" || exit 1
          fi
        continue-on-error: false

      - name: Validate canary completeness (if seed present)
        run: |
          SEED_FILE=""
          if [ -f "app/src/main/assets/places_seed_geocoded.json" ]; then
            SEED_FILE="app/src/main/assets/places_seed_geocoded.json"
          elif [ -f "app/src/main/assets/places_seed.json" ]; then
            SEED_FILE="app/src/main/assets/places_seed.json"
          fi
          if [ -n "$SEED_FILE" ] && [ -f "tools/canaries.json" ]; then
            python3 tools/canary_gate.py "$SEED_FILE" tools/canaries.json || exit 1
          fi
        continue-on-error: false

  # Syntax check for Kotlin files
  kotlin-syntax:
    name: Kotlin Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check Kotlin files can be parsed
        run: |
          # Find all .kt files and ensure they're not empty
          find app/src/main/java -name "*.kt" -exec sh -c 'if [ ! -s "$1" ]; then echo "Empty file: $1"; exit 1; fi' _ {} \;
        continue-on-error: false

  # Check for disallowed patterns (API keys, etc.)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for hardcoded API keys
        run: |
          # This is a basic check. In production, use a dedicated security scanner.
          if grep -r "AIza[A-Za-z0-9_-]{35}" app/src/main/java; then
            echo "ERROR: Found potential Google API key in source code"
            exit 1
          fi
          if grep -r "sk-[a-zA-Z0-9]{48}" app/src/main/java; then
            echo "ERROR: Found potential OpenAI API key in source code"
            exit 1
          fi
          echo "No obvious API keys found"
        continue-on-error: false

      - name: Check for test account references
        run: |
          # Per policy: no test-account dependencies in production
          if grep -ri "kyronfoodsafety" app/src/main/java; then
            echo "WARNING: Found reference to test account 'kyronfoodsafety'"
            echo "Ensure this is not a production dependency"
          fi
        continue-on-error: true  # Warning only

  # Manual build (placeholder - requires environment setup)
  manual-build:
    name: Manual Build
    runs-on: ubuntu-latest
    # This job is currently a placeholder. To enable:
    # 1. Set up Android SDK
    # 2. Download Kotlin compiler
    # 3. Create build directory structure
    # 4. Run fetch_deps.sh
    # 5. Run build_manual.sh
    if: false  # Disabled until environment is set up
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # Install Android SDK command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mkdir -p $HOME/kyron-build/android-sdk/cmdline-tools/latest
          mv cmdline-tools/* $HOME/kyron-build/android-sdk/cmdline-tools/latest/
          export ANDROID_SDK_ROOT=$HOME/kyron-build/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Kotlin compiler
        run: |
          mkdir -p $HOME/kyron-build
          cd $HOME/kyron-build
          curl -L -o kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.20/kotlin-compiler-2.0.20.zip
          unzip -q kotlin-compiler.zip

      - name: Create build structure
        run: |
          mkdir -p $HOME/kyron-build/manual/{work,deps}
          mkdir -p $HOME/kyron-build/tmp

      - name: Fetch dependencies
        run: |
          cd app
          chmod +x fetch_deps.sh
          # This would need KB environment variable set
          # ./fetch_deps.sh

      - name: Run manual build
        run: |
          cd app
          chmod +x build_manual.sh
          # This would need full environment setup
          # ./build_manual.sh

  # License check
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for license file
        run: |
          if [ ! -f "LICENSE" ]; then
            echo "ERROR: LICENSE file missing"
            exit 1
          fi
        continue-on-error: false

      - name: Verify license is MIT
        run: |
          if ! grep -q "MIT License" LICENSE; then
            echo "ERROR: LICENSE does not appear to be MIT"
            exit 1
          fi
        continue-on-error: false
